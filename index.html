<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Планировщик недели</title>
<style>
  :root {
    --bg: #f5f5f7;
    --card-bg: #ffffff;
    --border: #e2e2e6;
    --text: #1d1d1f;
    --text-muted: #86868b;
    --accent: #3b6fe0;
    --accent-light: #eaf0fd;
    --done: #34a853;
    --danger: #e0463b;
    --today-bg: #fff8e6;
    --today-border: #f0c14b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  header {
    padding: 24px 32px 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 1px solid var(--border);
    background: var(--card-bg);
  }

  h1 {
    font-size: 22px;
    font-weight: 600;
    margin: 0;
  }

  .stats {
    display: flex;
    gap: 24px;
    align-items: center;
  }

  .stat {
    text-align: center;
  }

  .stat .value {
    font-size: 20px;
    font-weight: 700;
  }

  .stat .label {
    font-size: 12px;
    color: var(--text-muted);
  }

  .progress-bar {
    width: 140px;
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: var(--done);
    width: 0%;
    transition: width 0.2s ease;
  }

  .clear-btn {
    background: none;
    border: 1px solid var(--danger);
    color: var(--danger);
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    white-space: nowrap;
  }

  .clear-btn:hover {
    background: var(--danger);
    color: #fff;
  }

  main {
    padding: 24px 32px 48px;
    max-width: 1600px;
    margin: 0 auto;
  }

  .board {
    display: grid;
    grid-template-columns: repeat(7, minmax(180px, 1fr));
    gap: 14px;
  }

  .day-column {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    min-height: 320px;
  }

  .day-column.today {
    background: var(--today-bg);
    border-color: var(--today-border);
  }

  .day-header {
    padding: 14px 14px 8px;
    border-bottom: 1px solid var(--border);
  }

  .day-column.today .day-header {
    border-bottom-color: var(--today-border);
  }

  .day-name {
    font-size: 15px;
    font-weight: 600;
  }

  .day-count {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .task-list {
    flex: 1;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .task-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 8px 8px;
    border-radius: 8px;
    background: var(--bg);
  }

  .task-item.done {
    opacity: 0.55;
  }

  .task-checkbox {
    margin-top: 2px;
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    cursor: pointer;
    accent-color: var(--done);
  }

  .task-text {
    flex: 1;
    font-size: 14px;
    line-height: 1.35;
    word-break: break-word;
  }

  .task-item.done .task-text {
    text-decoration: line-through;
  }

  .task-delete {
    border: none;
    background: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .task-delete:hover {
    color: var(--danger);
    background: #fce8e6;
  }

  .add-task-form {
    display: flex;
    gap: 6px;
    padding: 10px;
    border-top: 1px solid var(--border);
  }

  .day-column.today .add-task-form {
    border-top-color: var(--today-border);
  }

  .add-task-input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 8px;
    font-size: 13px;
    min-width: 0;
    font-family: inherit;
  }

  .add-task-input:focus {
    outline: none;
    border-color: var(--accent);
  }

  .add-task-btn {
    border: none;
    background: var(--accent);
    color: #fff;
    border-radius: 6px;
    padding: 0 12px;
    font-size: 16px;
    cursor: pointer;
    line-height: 1;
  }

  .add-task-btn:hover {
    background: #2f5cc0;
  }

  .empty-hint {
    color: var(--text-muted);
    font-size: 13px;
    text-align: center;
    padding: 16px 4px;
  }

  @media (max-width: 1100px) {
    .board {
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
    main { padding: 16px; }
    header { padding: 16px; }
  }

  @media (max-width: 500px) {
    .board { grid-template-columns: 1fr; }
    .stats { gap: 16px; }
  }
</style>
</head>
<body>

<header>
  <h1>Планировщик недели</h1>
  <div class="stats">
    <div class="stat">
      <div class="value" id="totalCount">0</div>
      <div class="label">всего задач</div>
    </div>
    <div class="stat">
      <div class="value" id="doneCount">0</div>
      <div class="label">выполнено</div>
    </div>
    <div class="progress-bar"><div class="progress-bar-fill" id="progressFill"></div></div>
    <button class="clear-btn" id="clearWeekBtn">Очистить неделю</button>
  </div>
</header>

<main>
  <div class="board" id="board"></div>
</main>

<script>
(function () {
  const STORAGE_KEY = "weekly-planner-tasks-v1";

  const DAYS = [
    { key: "mon", name: "Понедельник" },
    { key: "tue", name: "Вторник" },
    { key: "wed", name: "Среда" },
    { key: "thu", name: "Четверг" },
    { key: "fri", name: "Пятница" },
    { key: "sat", name: "Суббота" },
    { key: "sun", name: "Воскресенье" },
  ];

  function todayKey() {
    const jsDay = new Date().getDay();
    const order = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
    return order[jsDay];
  }

  function loadTasks() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return emptyState();
      const parsed = JSON.parse(raw);
      const state = emptyState();
      DAYS.forEach(d => {
        if (Array.isArray(parsed[d.key])) {
          state[d.key] = parsed[d.key].filter(
            t => t && typeof t.text === "string"
          ).map(t => ({
            id: t.id || genId(),
            text: t.text,
            done: !!t.done,
          }));
        }
      });
      return state;
    } catch (e) {
      return emptyState();
    }
  }

  function emptyState() {
    const state = {};
    DAYS.forEach(d => { state[d.key] = []; });
    return state;
  }

  function saveTasks() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  function genId() {
    return Math.random().toString(36).slice(2) + Date.now().toString(36);
  }

  let tasks = loadTasks();
  const board = document.getElementById("board");
  const todayK = todayKey();

  function render() {
    board.innerHTML = "";
    let total = 0;
    let done = 0;

    DAYS.forEach(day => {
      const dayTasks = tasks[day.key];
      total += dayTasks.length;
      done += dayTasks.filter(t => t.done).length;

      const col = document.createElement("div");
      col.className = "day-column" + (day.key === todayK ? " today" : "");

      const header = document.createElement("div");
      header.className = "day-header";
      const doneInDay = dayTasks.filter(t => t.done).length;
      header.innerHTML =
        `<div class="day-name">${day.name}</div>` +
        `<div class="day-count">${dayTasks.length ? doneInDay + " из " + dayTasks.length : "нет задач"}</div>`;
      col.appendChild(header);

      const list = document.createElement("div");
      list.className = "task-list";

      if (dayTasks.length === 0) {
        const hint = document.createElement("div");
        hint.className = "empty-hint";
        hint.textContent = "Пусто. Добавьте задачу ниже.";
        list.appendChild(hint);
      } else {
        dayTasks.forEach(task => {
          const item = document.createElement("div");
          item.className = "task-item" + (task.done ? " done" : "");

          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.className = "task-checkbox";
          checkbox.checked = task.done;
          checkbox.addEventListener("change", () => {
            task.done = checkbox.checked;
            saveTasks();
            render();
          });

          const text = document.createElement("div");
          text.className = "task-text";
          text.textContent = task.text;

          const del = document.createElement("button");
          del.className = "task-delete";
          del.textContent = "✕";
          del.title = "Удалить задачу";
          del.addEventListener("click", () => {
            tasks[day.key] = tasks[day.key].filter(t => t.id !== task.id);
            saveTasks();
            render();
          });

          item.appendChild(checkbox);
          item.appendChild(text);
          item.appendChild(del);
          list.appendChild(item);
        });
      }

      col.appendChild(list);

      const form = document.createElement("form");
      form.className = "add-task-form";
      const input = document.createElement("input");
      input.type = "text";
      input.className = "add-task-input";
      input.placeholder = "Новая задача...";
      input.maxLength = 200;
      const addBtn = document.createElement("button");
      addBtn.type = "submit";
      addBtn.className = "add-task-btn";
      addBtn.textContent = "+";

      form.addEventListener("submit", e => {
        e.preventDefault();
        const value = input.value.trim();
        if (!value) return;
        tasks[day.key].push({ id: genId(), text: value, done: false });
        saveTasks();
        input.value = "";
        render();
        const newInput = board.querySelectorAll(".day-column")[DAYS.findIndex(d => d.key === day.key)]
          .querySelector(".add-task-input");
        if (newInput) newInput.focus();
      });

      form.appendChild(input);
      form.appendChild(addBtn);
      col.appendChild(form);

      board.appendChild(col);
    });

    document.getElementById("totalCount").textContent = total;
    document.getElementById("doneCount").textContent = done;
    const pct = total === 0 ? 0 : Math.round((done / total) * 100);
    document.getElementById("progressFill").style.width = pct + "%";
  }

  document.getElementById("clearWeekBtn").addEventListener("click", () => {
    if (confirm("Удалить все задачи на неделю? Это действие нельзя отменить.")) {
      tasks = emptyState();
      saveTasks();
      render();
    }
  });

  render();
})();
</script>

</body>
</html>
